<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Path of a Packet Through the Linux Kernel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e14; }
  #root { min-height: 100vh; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const isInIframe = (() => { try { return window.self !== window.top; } catch(e) { return true; } })();

const COLORS = {
  bg: "#0a0e14",
  surface: "#111820",
  surfaceLight: "#1a2230",
  border: "#2a3545",
  borderActive: "#3d8bfd",
  text: "#c8d3e0",
  textDim: "#6b7d93",
  textBright: "#e8edf3",
  accent: "#3d8bfd",
  accentGlow: "rgba(61,139,253,0.15)",
  green: "#43d9a2",
  greenDim: "rgba(67,217,162,0.15)",
  orange: "#f0a050",
  orangeDim: "rgba(240,160,80,0.15)",
  red: "#f05868",
  redDim: "rgba(240,88,104,0.15)",
  purple: "#b07df0",
  purpleDim: "rgba(176,125,240,0.15)",
  yellow: "#e8d44d",
  yellowDim: "rgba(232,212,77,0.15)",
  cyan: "#40d0e0",
  cyanDim: "rgba(64,208,224,0.15)",
};

const fontMono = "'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace";
const fontSans = "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif";

function FuncBox({ x, y, w, h, label, sublabel, color, dimColor, fontSize = 11 }) {
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx={4} fill={dimColor} stroke={color} strokeWidth={1.2} />
      <text x={x + w / 2} y={y + (sublabel ? h / 2 - 4 : h / 2 + 1)} textAnchor="middle" dominantBaseline="middle" fill={color} fontFamily={fontMono} fontSize={fontSize} fontWeight={600}>
        {label}
      </text>
      {sublabel && (
        <text x={x + w / 2} y={y + h / 2 + 10} textAnchor="middle" dominantBaseline="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={9}>
          {sublabel}
        </text>
      )}
    </g>
  );
}

function Arrow({ x1, y1, x2, y2, color = COLORS.textDim, dashed = false, label = "" }) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len;
  const uy = dy / len;
  const ax2 = x2 - ux * 6;
  const ay2 = y2 - uy * 6;
  const px = -uy * 4;
  const py = ux * 4;
  return (
    <g>
      <line x1={x1} y1={y1} x2={ax2} y2={ay2} stroke={color} strokeWidth={1.3} strokeDasharray={dashed ? "4,3" : "none"} />
      <polygon points={`${x2},${y2} ${ax2 + px},${ay2 + py} ${ax2 - px},${ay2 - py}`} fill={color} />
      {label && (
        <text x={(x1 + x2) / 2 + 8} y={(y1 + y2) / 2} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5} dominantBaseline="middle">
          {label}
        </text>
      )}
    </g>
  );
}

function LayerBand({ x, y, w, h, label, color, dimColor }) {
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx={6} fill={dimColor} stroke={color} strokeWidth={0.8} strokeDasharray="6,4" opacity={0.5} />
      <text x={x + 10} y={y + 16} fill={color} fontFamily={fontSans} fontSize={11} fontWeight={700} opacity={0.8} letterSpacing="1.5">
        {label}
      </text>
    </g>
  );
}

function HookMarker({ x, y, label, color = COLORS.red }) {
  return (
    <g>
      <circle cx={x} cy={y} r={4} fill={color} opacity={0.8} />
      <circle cx={x} cy={y} r={7} fill="none" stroke={color} strokeWidth={0.8} opacity={0.4} />
      <text x={x + 10} y={y + 1} fill={color} fontFamily={fontMono} fontSize={8} dominantBaseline="middle" opacity={0.9}>
        {label}
      </text>
    </g>
  );
}

function EgressDiagram() {
  const W = 920;
  const H = 1300;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <rect width={W} height={H} fill={COLORS.bg} rx={8} />

      <text x={W / 2} y={35} textAnchor="middle" fill={COLORS.textBright} fontFamily={fontSans} fontSize={18} fontWeight={700} letterSpacing="0.5">
        EGRESS PATH — TX
      </text>
      <text x={W / 2} y={52} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={11}>
        Userspace Application → Wire
      </text>

      {/* USERSPACE */}
      <LayerBand x={30} y={70} w={W - 60} h={70} label="USERSPACE" color={COLORS.green} dimColor={COLORS.greenDim} />
      <FuncBox x={340} y={90} w={240} h={36} label="write() / sendto() / sendmsg()" color={COLORS.green} dimColor={COLORS.bg} fontSize={10} />
      <Arrow x1={460} y1={126} x2={460} y2={165} color={COLORS.green} label="syscall" />
      <text x={200} y={114} fill={COLORS.textDim} fontFamily={fontSans} fontSize={9}>Application buffer (userspace)</text>

      {/* SOCKET LAYER */}
      <LayerBand x={30} y={165} w={W - 60} h={110} label="SOCKET LAYER" color={COLORS.accent} dimColor={COLORS.accentGlow} />
      <FuncBox x={340} y={188} w={240} h={32} label="sock_sendmsg()" sublabel="" color={COLORS.accent} dimColor={COLORS.bg} />
      <text x={620} y={200} fill={COLORS.textDim} fontFamily={fontSans} fontSize={9}>Attach creds from task_struct</text>
      <text x={620} y={213} fill={COLORS.textDim} fontFamily={fontSans} fontSize={9}>(PID, UID, GID)</text>

      <HookMarker x={370} y={232} label="LSM hook (SELinux / AppArmor)" color={COLORS.red} />

      <FuncBox x={340} y={245} w={240} h={26} label="INDIRECT_CALL_INET" color={COLORS.accent} dimColor={COLORS.bg} fontSize={10} />
      <text x={620} y={260} fill={COLORS.textDim} fontFamily={fontSans} fontSize={9}>Dispatch via sk_prot→sendmsg</text>

      {/* Branch to TCP / UDP */}
      <Arrow x1={400} y1={271} x2={260} y2={310} color={COLORS.accent} />
      <Arrow x1={520} y1={271} x2={660} y2={310} color={COLORS.accent} />

      {/* TRANSPORT LAYER */}
      <LayerBand x={30} y={290} w={W - 60} h={270} label="TRANSPORT LAYER" color={COLORS.orange} dimColor={COLORS.orangeDim} />

      {/* TCP Column */}
      <rect x={60} y={310} width={370} height={240} rx={5} fill="rgba(240,160,80,0.05)" stroke={COLORS.orange} strokeWidth={0.5} strokeDasharray="3,3" />
      <text x={245} y={328} textAnchor="middle" fill={COLORS.orange} fontFamily={fontSans} fontSize={12} fontWeight={700}>TCP</text>

      <FuncBox x={110} y={338} w={270} h={26} label="tcp_sendmsg()" color={COLORS.orange} dimColor={COLORS.bg} />
      <text x={110} y={376} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Wait for ESTABLISHED state</text>
      <text x={110} y={388} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Alloc sk_buff per MSS, copy from user</text>
      <text x={110} y={400} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• skb_add_data_nocache() or new pages</text>
      <text x={110} y={412} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Enqueue to sk→sk_write_queue</text>

      <FuncBox x={110} y={420} w={270} h={26} label="tcp_push() → tcp_write_xmit()" color={COLORS.orange} dimColor={COLORS.bg} fontSize={10} />
      <text x={110} y={458} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Apply cwnd / rwnd constraints</text>
      <text x={110} y={470} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Set retransmission timers</text>
      <text x={110} y={482} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Build TCP hdr (seq/ack/flags/win/opts)</text>

      <FuncBox x={110} y={492} w={270} h={26} label="tcp_transmit_skb()" color={COLORS.orange} dimColor={COLORS.bg} />
      <text x={110} y={530} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Checksum (or CHECKSUM_PARTIAL for HW)</text>
      <text x={110} y={542} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• icsk_af_ops→queue_xmit → IP layer</text>

      {/* UDP Column */}
      <rect x={490} y={310} width={370} height={240} rx={5} fill="rgba(240,160,80,0.05)" stroke={COLORS.orange} strokeWidth={0.5} strokeDasharray="3,3" />
      <text x={675} y={328} textAnchor="middle" fill={COLORS.orange} fontFamily={fontSans} fontSize={12} fontWeight={700}>UDP</text>

      <FuncBox x={540} y={338} w={270} h={26} label="udp_sendmsg()" color={COLORS.orange} dimColor={COLORS.bg} />
      <text x={540} y={376} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• ip_route_output_flow() — route lookup</text>
      <text x={540} y={388} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Build UDP header (src/dst port, len, csum)</text>

      <FuncBox x={540} y={400} w={270} h={26} label="Cork / No-Cork decision" color={COLORS.orange} dimColor={COLORS.bg} fontSize={10} />
      <text x={540} y={438} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• UDP_CORK: batch multiple sendmsg()</text>
      <text x={540} y={450} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• No cork: build sk_buff immediately</text>

      <FuncBox x={540} y={460} w={270} h={26} label="ip_make_skb() + udp_send_skb()" color={COLORS.orange} dimColor={COLORS.bg} fontSize={10} />
      <text x={540} y={498} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• ip_append_data() combines datagrams</text>
      <text x={540} y={510} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>• Simpler: no locking, no state machine</text>

      {/* Merge arrows to IP */}
      <Arrow x1={460} y1={560} x2={460} y2={580} color={COLORS.orange} />

      {/* IP LAYER */}
      <LayerBand x={30} y={580} w={W - 60} h={280} label="IP LAYER (IPv4)" color={COLORS.purple} dimColor={COLORS.purpleDim} />

      <FuncBox x={300} y={598} w={320} h={28} label="__ip_queue_xmit() / ip_push_pending_frames()" color={COLORS.purple} dimColor={COLORS.bg} fontSize={9.5} />
      <text x={660} y={610} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Route lookup: FIB trie</text>
      <text x={660} y={622} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>(skip if cached in skb→_skb_refdst)</text>

      <FuncBox x={340} y={640} w={240} h={26} label="Build IP header" color={COLORS.purple} dimColor={COLORS.bg} fontSize={10} />
      <text x={620} y={655} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>ver, IHL, TOS, TTL, proto, src/dst addr</text>

      <HookMarker x={190} y={680} label="NF_INET_LOCAL_OUT (iptables OUTPUT chain, conntrack)" color={COLORS.red} />

      <FuncBox x={340} y={698} w={240} h={26} label="ip_output()" color={COLORS.purple} dimColor={COLORS.bg} />

      <HookMarker x={190} y={738} label="NF_INET_POST_ROUTING  (SNAT / masquerade)" color={COLORS.red} />

      <FuncBox x={340} y={755} w={240} h={26} label="ip_finish_output()" color={COLORS.purple} dimColor={COLORS.bg} />
      <text x={620} y={766} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>MTU check → ip_fragment() if needed</text>
      <text x={620} y={778} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>(unless DF set — PMTUD)</text>

      <FuncBox x={340} y={798} w={240} h={32} label="neigh_resolve_output()" sublabel="" color={COLORS.purple} dimColor={COLORS.bg} />
      <text x={620} y={810} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>ARP cache or ARP request</text>
      <text x={620} y={822} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Queue skb if ARP pending</text>

      <text x={370} y={848} fill={COLORS.purple} fontFamily={fontMono} fontSize={9}>Push Ethernet header onto sk_buff</text>

      <Arrow x1={460} y1={625} x2={460} y2={640} color={COLORS.purple} />
      <Arrow x1={460} y1={666} x2={460} y2={698} color={COLORS.purple} />
      <Arrow x1={460} y1={724} x2={460} y2={755} color={COLORS.purple} />
      <Arrow x1={460} y1={781} x2={460} y2={798} color={COLORS.purple} />

      {/* QDISC / DEVICE LAYER */}
      <LayerBand x={30} y={870} w={W - 60} h={220} label="QDISC / DEVICE LAYER" color={COLORS.cyan} dimColor={COLORS.cyanDim} />

      <Arrow x1={460} y1={860} x2={460} y2={898} color={COLORS.cyan} />

      <FuncBox x={340} y={898} w={240} h={26} label="dev_queue_xmit()" color={COLORS.cyan} dimColor={COLORS.bg} />
      <text x={620} y={913} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Set skb→mac_header</text>

      <HookMarker x={190} y={938} label="tc_egress() — TC-BPF / u32 / flower classifiers" color={COLORS.red} />

      <FuncBox x={340} y={955} w={240} h={26} label="qdisc enqueue / __qdisc_run()" color={COLORS.cyan} dimColor={COLORS.bg} fontSize={10} />
      <text x={620} y={968} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>pfifo_fast / fq_codel / HTB / etc.</text>

      <FuncBox x={340} y={995} w={240} h={28} label="validate_xmit_skb()" color={COLORS.cyan} dimColor={COLORS.bg} />
      <text x={620} y={1008} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>VLAN tag, GSO/TSO segmentation,</text>
      <text x={620} y={1020} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>checksum finalization</text>

      <FuncBox x={340} y={1035} w={240} h={26} label="ndo_start_xmit()" color={COLORS.cyan} dimColor={COLORS.bg} />
      <text x={620} y={1050} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Driver callback → TX ring descriptor</text>

      <Arrow x1={460} y1={924} x2={460} y2={955} color={COLORS.cyan} />
      <Arrow x1={460} y1={981} x2={460} y2={995} color={COLORS.cyan} />
      <Arrow x1={460} y1={1023} x2={460} y2={1035} color={COLORS.cyan} />

      {/* Bypass path */}
      <rect x={80} y={955} width={200} height={55} rx={4} fill="rgba(64,208,224,0.07)" stroke={COLORS.cyan} strokeWidth={0.7} strokeDasharray="3,2" />
      <text x={180} y={970} textAnchor="middle" fill={COLORS.cyan} fontFamily={fontMono} fontSize={8.5} fontWeight={600}>BYPASS: dev_direct_xmit()</text>
      <text x={180} y={985} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={8}>AF_XDP — skips qdisc entirely</text>
      <text x={180} y={998} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={8}>Writes directly to TX ring</text>
      <Arrow x1={180} y1={1010} x2={340} y2={1048} color={COLORS.cyan} dashed />

      {/* NIC */}
      <LayerBand x={30} y={1100} w={W - 60} h={70} label="NIC HARDWARE" color={COLORS.yellow} dimColor={COLORS.yellowDim} />
      <Arrow x1={460} y1={1061} x2={460} y2={1115} color={COLORS.yellow} />

      <FuncBox x={300} y={1115} w={320} h={36} label="TX Ring → DMA → Wire" sublabel="MMIO doorbell write triggers NIC transmit" color={COLORS.yellow} dimColor={COLORS.bg} />

      {/* Wire */}
      <line x1={200} y1={1175} x2={720} y2={1175} stroke={COLORS.yellow} strokeWidth={2} filter="url(#glow)" />
      <Arrow x1={460} y1={1151} x2={460} y2={1175} color={COLORS.yellow} />
      <text x={460} y={1192} textAnchor="middle" fill={COLORS.yellow} fontFamily={fontSans} fontSize={11} fontWeight={600}>WIRE</text>

      {/* sk_buff annotation */}
      <rect x={60} y={1210} width={800} height={65} rx={5} fill={COLORS.surfaceLight} stroke={COLORS.border} strokeWidth={0.8} />
      <text x={80} y={1230} fill={COLORS.textBright} fontFamily={fontSans} fontSize={10} fontWeight={600}>sk_buff pointer progression (egress):</text>
      <text x={80} y={1248} fill={COLORS.textDim} fontFamily={fontMono} fontSize={9}>transport_header ← set by TCP/UDP when building transport header</text>
      <text x={80} y={1262} fill={COLORS.textDim} fontFamily={fontMono} fontSize={9}>network_header  ← set by IP layer when building IP header</text>
      <text x={80} y={1248} fill={COLORS.textDim} fontFamily={fontMono} fontSize={9} dx={500}>mac_header ← set by dev_queue_xmit()</text>
    </svg>
  );
}

function IngressDiagram() {
  const W = 920;
  const H = 1500;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      <defs>
        <filter id="glow2">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <rect width={W} height={H} fill={COLORS.bg} rx={8} />

      <text x={W / 2} y={35} textAnchor="middle" fill={COLORS.textBright} fontFamily={fontSans} fontSize={18} fontWeight={700} letterSpacing="0.5">
        INGRESS PATH — RX
      </text>
      <text x={W / 2} y={52} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={11}>
        Wire → Userspace Application
      </text>

      {/* Wire */}
      <line x1={200} y1={75} x2={720} y2={75} stroke={COLORS.yellow} strokeWidth={2} filter="url(#glow2)" />
      <text x={460} y={70} textAnchor="middle" fill={COLORS.yellow} fontFamily={fontSans} fontSize={11} fontWeight={600}>WIRE</text>

      {/* NIC */}
      <LayerBand x={30} y={90} w={W - 60} h={110} label="NIC HARDWARE" color={COLORS.yellow} dimColor={COLORS.yellowDim} />
      <Arrow x1={460} y1={78} x2={460} y2={110} color={COLORS.yellow} />
      <FuncBox x={300} y={110} w={320} h={30} label="NIC receives frame" color={COLORS.yellow} dimColor={COLORS.bg} />
      <text x={660} y={120} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>MAC filter, FCS check</text>
      <text x={660} y={132} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>HW checksum offload, RSS hash</text>

      <FuncBox x={300} y={150} w={320} h={30} label="DMA → RX Ring descriptor" color={COLORS.yellow} dimColor={COLORS.bg} fontSize={10} />
      <text x={660} y={168} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Write pkt to pre-alloc'd ring buffer</text>
      <Arrow x1={460} y1={140} x2={460} y2={150} color={COLORS.yellow} />
      <Arrow x1={460} y1={180} x2={460} y2={210} color={COLORS.yellow} label="MSI-X IRQ" />

      {/* DRIVER / NAPI */}
      <LayerBand x={30} y={210} w={W - 60} h={180} label="DRIVER / NAPI" color={COLORS.cyan} dimColor={COLORS.cyanDim} />

      <FuncBox x={300} y={232} w={320} h={30} label="IRQ handler → napi_schedule()" color={COLORS.cyan} dimColor={COLORS.bg} fontSize={10} />
      <text x={660} y={245} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Schedule NAPI poll, mask IRQ</text>
      <text x={660} y={257} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Coalescing prevents per-pkt interrupts</text>

      <FuncBox x={300} y={275} w={320} h={30} label="NET_RX_SOFTIRQ → napi_poll()" color={COLORS.cyan} dimColor={COLORS.bg} fontSize={10} />
      <text x={660} y={290} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>Driver poll fn walks RX ring</text>

      <FuncBox x={300} y={316} w={320} h={26} label="Alloc sk_buff / page-pool pages" color={COLORS.cyan} dimColor={COLORS.bg} fontSize={10} />
      <text x={660} y={332} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>eth_type_trans() → skb→protocol</text>

      <FuncBox x={300} y={352} w={320} h={26} label="napi_gro_receive()" color={COLORS.cyan} dimColor={COLORS.bg} />
      <text x={660} y={362} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>GRO: coalesce TCP segments</text>
      <text x={660} y={374} fill={COLORS.textDim} fontFamily={fontSans} fontSize={8.5}>into single large skb</text>

      <Arrow x1={460} y1={262} x2={460} y2={275} color={COLORS.cyan} />
      <Arrow x1={460} y1={305} x2={460} y2={316} color={COLORS.cyan} />
      <Arrow x1={460} y1={342} x2={460} y2={352} color={COLORS.cyan} />

      {/* XDP bypass */}
      <rect x={60} y={245} width={200} height={60} rx={4} fill="rgba(64,208,224,0.07)" stroke={COLORS.cyan} strokeWidth={0.7} strokeDasharray="3,2" />
      <text x={160} y={260} textAnchor="middle" fill={COLORS.cyan} fontFamily={fontMono} fontSize={8.5} fontWeight={600}>XDP HOOK (pre-skb alloc)</text>
      <text x={160} y={275} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={8}>XDP_DROP / XDP_TX / XDP_REDIRECT</text>
      <text x={160} y={288} textAnchor="middle" fill={COLORS.textDim} fontFamily={fontSans} fontSize={8}>BPF_PROG_TYPE_XDP</text>

function ZoomableContainer({ children, tab }) {
  const [scale, setScale] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [isPanning, setIsPanning] = useState(false);
  const [panStart, setPanStart] = useState({ x: 0, y: 0 });
  const containerRef = useRef(null);

  // Reset zoom/pan when tab changes
  useEffect(() => {
    setScale(1);
    setPan({ x: 0, y: 0 });
  }, [tab]);

  const ZOOM_STEP = 0.15;
  const MIN_ZOOM = 0.3;
  const MAX_ZOOM = 4;

  const zoomIn = useCallback(() => {
    setScale((s) => Math.min(MAX_ZOOM, s + ZOOM_STEP));
  }, []);

  const zoomOut = useCallback(() => {
    setScale((s) => Math.max(MIN_ZOOM, s - ZOOM_STEP));
  }, []);

  const resetView = useCallback(() => {
    setScale(1);
    setPan({ x: 0, y: 0 });
  }, []);

  const handleWheel = useCallback((e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
    setScale((s) => Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, s + delta)));
  }, []);

  const handleMouseDown = useCallback((e) => {
    if (e.button !== 0) return;
    setIsPanning(true);
    setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
  }, [pan]);

  const handleMouseMove = useCallback((e) => {
    if (!isPanning) return;
    setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
  }, [isPanning, panStart]);

  const handleMouseUp = useCallback(() => {
    setIsPanning(false);
  }, []);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    el.addEventListener("wheel", handleWheel, { passive: false });
    return () => el.removeEventListener("wheel", handleWheel);
  }, [handleWheel]);

  const zoomPct = Math.round(scale * 100);

  const btnStyle = (active) => ({
    width: 36, height: 36,
    border: `1px solid ${COLORS.border}`,
    borderRadius: 6,
    background: active ? COLORS.surfaceLight : COLORS.surface,
    color: COLORS.textBright,
    fontFamily: fontMono,
    fontSize: 16,
    fontWeight: 700,
    cursor: "pointer",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    transition: "all 0.15s",
    lineHeight: 1,
  });

  return (
    <div style={{ position: "relative" }}>
      {/* Zoom toolbar */}
      <div style={{
        position: "sticky", top: 0, zIndex: 10,
        display: "flex", alignItems: "center", gap: 6,
        padding: "8px 12px",
        background: `${COLORS.surface}ee`,
        backdropFilter: "blur(8px)",
        borderBottom: `1px solid ${COLORS.border}`,
        borderRadius: "8px 8px 0 0",
      }}>
        <button onClick={zoomOut} style={btnStyle()} title="Zoom out (or scroll down)">−</button>
        <div style={{
          minWidth: 52, textAlign: "center",
          color: COLORS.textDim, fontFamily: fontMono, fontSize: 11,
          userSelect: "none",
        }}>
          {zoomPct}%
        </div>
        <button onClick={zoomIn} style={btnStyle()} title="Zoom in (or scroll up)">+</button>
        <button onClick={resetView} style={{ ...btnStyle(), width: "auto", padding: "0 10px", fontSize: 11 }} title="Reset zoom and pan">
          Reset
        </button>
        <div style={{ flex: 1 }} />
        <span style={{ color: COLORS.textDim, fontFamily: fontSans, fontSize: 10, opacity: 0.7, userSelect: "none" }}>
          Scroll to zoom · Drag to pan
        </span>
      </div>

      {/* Zoomable viewport */}
      <div
        ref={containerRef}
        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
        style={{
          overflow: "hidden",
          cursor: isPanning ? "grabbing" : "grab",
          borderRadius: "0 0 8px 8px",
          border: `1px solid ${COLORS.border}`,
          borderTop: "none",
          maxHeight: isInIframe ? "75vh" : "calc(100vh - 160px)",
          background: COLORS.bg,
        }}
      >
        <div style={{
          transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})`,
          transformOrigin: "top center",
          transition: isPanning ? "none" : "transform 0.15s ease-out",
          willChange: "transform",
        }}>
          {children}
        </div>
      </div>
    </div>
  );
}

}
